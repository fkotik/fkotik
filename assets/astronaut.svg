<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="1" stop-color="#1c2260"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#5b7fd6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1f2f6b" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="earth" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5aa0ff"/>
      <stop offset="1" stop-color="#1f4fc0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="800" height="340" rx="18"/></clipPath>
    <clipPath id="ec"><circle r="55"/></clipPath>
  </defs>

  <style>
    .s { animation: tw 3s ease-in-out infinite; }
    @keyframes tw {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s infinite;
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.08); }
    }

    .bubble {
      transform-box: fill-box;
      transform-origin: 0% 100%;
      animation: pop 7s infinite;
    }
    @keyframes pop {
      0%, 8%    { transform: scale(0); opacity: 0; }
      14%       { transform: scale(1.12); opacity: 1; }
      18%, 60%  { transform: scale(1); opacity: 1; }
      68%, 100% { transform: scale(0); opacity: 0; }
    }

    .fbob { animation: fb 4s ease-in-out infinite; }
    @keyframes fb {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="340" fill="url(#space)"/>

    <!-- Звёзды -->
    <g fill="#fff">
      <circle class="s" cx="50" cy="45" r="1.5"/>
      <circle class="s" cx="150" cy="80" r="1" style="animation-delay:-0.6s"/>
      <circle class="s" cx="250" cy="35" r="2" style="animation-delay:-1.2s"/>
      <circle class="s" cx="320" cy="90" r="1.2" style="animation-delay:-1.8s"/>
      <circle class="s" cx="450" cy="28" r="1.5" style="animation-delay:-2.4s"/>
      <circle class="s" cx="740" cy="60" r="1.5" style="animation-delay:-0.3s"/>
      <circle class="s" cx="710" cy="130" r="1" style="animation-delay:-0.9s"/>
      <circle class="s" cx="30" cy="150" r="1.2" style="animation-delay:-1.5s"/>
      <circle class="s" cx="240" cy="170" r="1.5" style="animation-delay:-2.1s"/>
      <circle class="s" cx="560" cy="110" r="1" style="animation-delay:-2.7s"/>
      <circle class="s" cx="770" cy="200" r="1.5" style="animation-delay:-0.4s"/>
      <circle class="s" cx="620" cy="40" r="1.2" style="animation-delay:-1s"/>
      <circle class="s" cx="210" cy="290" r="1" style="animation-delay:-1.6s"/>
      <circle class="s" cx="480" cy="310" r="1.5" style="animation-delay:-2.2s"/>
      <circle class="s" cx="600" cy="295" r="1" style="animation-delay:-0.2s"/>
    </g>

    <!-- Земля -->
    <g transform="translate(95,285)">
      <circle r="64" fill="#4fc3f7" opacity="0.13"/>
      <circle r="55" fill="url(#earth)"/>
      <g clip-path="url(#ec)" fill="#4caf6a">
        <path d="M-32,-22 Q-12,-38 6,-24 Q12,-10 -5,-4 Q-22,2 -32,-22 Z"/>
        <path d="M12,6 Q32,0 40,18 Q32,36 16,30 Q6,20 12,6 Z"/>
        <path d="M-20,20 Q-8,16 -4,28 Q-14,38 -24,32 Z"/>
      </g>
      <circle r="55" fill="none" stroke="#bfe3ff" stroke-opacity="0.25" stroke-width="2"/>
    </g>

    <!-- Луна -->
    <g transform="translate(720,305)">
      <circle r="48" fill="#d5dbea"/>
      <circle cx="-14" cy="-14" r="8" fill="#b3bbd1"/>
      <circle cx="12" cy="-4" r="5" fill="#b3bbd1"/>
      <circle cx="-4" cy="14" r="10" fill="#b3bbd1"/>
    </g>

    <!-- Рыбка, голубая -->
    <g transform="translate(185,130)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-20;20;-20" dur="6s" repeatCount="indefinite"/>
        <g class="fbob">
          <ellipse rx="20" ry="11" fill="#4fc3f7"/>
          <path d="M16,0 L34,-12 L34,12 Z" fill="#4fc3f7"/>
          <path d="M-4,-10 Q2,-19 9,-9 Z" fill="#2a8fd0"/>
          <path d="M0,-6 Q3,0 0,6" stroke="#2a8fd0" stroke-width="2" fill="none"/>
          <circle cx="-10" cy="-2" r="2.4" fill="#0b1026"/>
        </g>
      </g>
    </g>

    <!-- Рыбка, жёлтая -->
    <g transform="translate(640,225) scale(0.8)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="15;-20;15" dur="7s" repeatCount="indefinite"/>
        <g class="fbob" style="animation-delay:-2s">
          <ellipse rx="20" ry="11" fill="#ffd166"/>
          <path d="M16,0 L34,-12 L34,12 Z" fill="#ffd166"/>
          <path d="M-4,-10 Q2,-19 9,-9 Z" fill="#f0a830"/>
          <path d="M0,-6 Q3,0 0,6" stroke="#f0a830" stroke-width="2" fill="none"/>
          <circle cx="-10" cy="-2" r="2.4" fill="#0b1026"/>
        </g>
      </g>
    </g>

    <!-- Котик-астронавт: парение -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-3 400 200;3 400 200;-3 400 200" dur="7s" repeatCount="indefinite"/>

        <!-- Хвост -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-8 445 268;10 445 268;-8 445 268" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
          <path d="M445,268 C490,285 540,285 545,245" fill="none" stroke="#d9792e" stroke-width="20" stroke-linecap="round"/>
          <path d="M445,268 C490,285 540,285 545,245" fill="none" stroke="#ffb066" stroke-width="14" stroke-linecap="round"/>
          <path d="M445,268 C490,285 540,285 545,245" fill="none" stroke="#d9792e" stroke-width="14" stroke-dasharray="5 14" stroke-dashoffset="-10"/>
        </g>

        <!-- Ранец -->
        <rect x="340" y="190" width="10" height="44" rx="5" fill="#6f84ad"/>
        <rect x="450" y="190" width="10" height="44" rx="5" fill="#6f84ad"/>
        <rect x="346" y="178" width="108" height="72" rx="16" fill="#8fa3c8" stroke="#6f84ad" stroke-width="3"/>

        <!-- Ноги -->
        <g transform="translate(378,268)">
          <animateTransform attributeName="transform" type="rotate" values="6;-6;6" dur="2.5s" repeatCount="indefinite" additive="sum"/>
          <ellipse cx="0" cy="18" rx="16" ry="24" fill="#f2f6ff" stroke="#9fb3d9" stroke-width="3"/>
          <ellipse cx="0" cy="40" rx="19" ry="10" fill="#4a6fd8" stroke="#3452b0" stroke-width="2"/>
        </g>
        <g transform="translate(422,268)">
          <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="2.5s" repeatCount="indefinite" additive="sum"/>
          <ellipse cx="0" cy="18" rx="16" ry="24" fill="#f2f6ff" stroke="#9fb3d9" stroke-width="3"/>
          <ellipse cx="0" cy="40" rx="19" ry="10" fill="#4a6fd8" stroke="#3452b0" stroke-width="2"/>
        </g>

        <!-- Тело -->
        <ellipse cx="400" cy="235" rx="52" ry="52" fill="#f2f6ff" stroke="#9fb3d9" stroke-width="3"/>

        <!-- Панель на груди -->
        <rect x="376" y="224" width="48" height="26" rx="6" fill="#26335f" stroke="#9fb3d9" stroke-width="2"/>
        <circle cx="388" cy="237" r="4" fill="#4fc3f7">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="400" cy="237" r="4" fill="#ffd166">
          <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="412" cy="237" r="4" fill="#ff9f43">
          <animate attributeName="opacity" values="1;0.2;1" dur="0.9s" repeatCount="indefinite"/>
        </circle>

        <!-- Левая рука -->
        <g transform="translate(352,218)">
          <animateTransform attributeName="transform" type="rotate" values="4;-6;4" dur="3s" repeatCount="indefinite" additive="sum"/>
          <line x1="0" y1="0" x2="-30" y2="22" stroke="#9fb3d9" stroke-width="26" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="-30" y2="22" stroke="#f2f6ff" stroke-width="20" stroke-linecap="round"/>
          <circle cx="-30" cy="22" r="11" fill="#dfe7f7" stroke="#9fb3d9" stroke-width="3"/>
        </g>

        <!-- Правая рука, машет -->
        <g transform="translate(448,218)">
          <animateTransform attributeName="transform" type="rotate" values="-18;14;-18" dur="1.1s" repeatCount="indefinite" additive="sum"/>
          <line x1="0" y1="0" x2="36" y2="-24" stroke="#9fb3d9" stroke-width="26" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="36" y2="-24" stroke="#f2f6ff" stroke-width="20" stroke-linecap="round"/>
          <circle cx="36" cy="-24" r="11" fill="#dfe7f7" stroke="#9fb3d9" stroke-width="3"/>
        </g>

        <!-- Воротник -->
        <ellipse cx="400" cy="205" rx="56" ry="13" fill="#dfe7f7" stroke="#9fb3d9" stroke-width="3"/>

        <!-- Шлем: фон -->
        <circle cx="400" cy="140" r="72" fill="url(#glass)"/>

        <!-- Уши -->
        <path d="M356,122 L360,92 L388,108 Z" fill="#ffb066" stroke="#d9792e" stroke-width="3" stroke-linejoin="round"/>
        <path d="M444,122 L440,92 L412,108 Z" fill="#ffb066" stroke="#d9792e" stroke-width="3" stroke-linejoin="round"/>
        <path d="M363,114 L365,100 L378,108 Z" fill="#ffd9a8"/>
        <path d="M437,114 L435,100 L422,108 Z" fill="#ffd9a8"/>

        <!-- Голова -->
        <ellipse cx="400" cy="145" rx="52" ry="46" fill="#ffb066" stroke="#d9792e" stroke-width="3"/>

        <!-- Полоски -->
        <path d="M392,100 L394,112 M400,98 L400,111 M408,100 L406,112" stroke="#d9792e" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- Мордочка -->
        <ellipse cx="400" cy="166" rx="21" ry="14" fill="#fff1dc"/>
        <ellipse cx="364" cy="164" rx="9" ry="5" fill="#ffc27d" opacity="0.8"/>
        <ellipse cx="436" cy="164" rx="9" ry="5" fill="#ffc27d" opacity="0.8"/>

        <!-- Глаза -->
        <g class="eye">
          <ellipse cx="378" cy="146" rx="7" ry="9" fill="#1d1b2e"/>
          <circle cx="380.5" cy="142.5" r="2.6" fill="#fff"/>
        </g>
        <g class="eye">
          <ellipse cx="422" cy="146" rx="7" ry="9" fill="#1d1b2e"/>
          <circle cx="424.5" cy="142.5" r="2.6" fill="#fff"/>
        </g>

        <!-- Носик и ротик -->
        <path d="M395,160 L405,160 L400,167 Z" fill="#c0653a" stroke="#c0653a" stroke-width="2" stroke-linejoin="round"/>
        <path d="M400,167 Q395,175 389,170 M400,167 Q405,175 411,170" stroke="#5a3320" stroke-width="2.2" stroke-linecap="round" fill="none"/>

        <!-- Усики -->
        <g stroke="#fff" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round">
          <line x1="354" y1="162" x2="338" y2="157"/>
          <line x1="354" y1="170" x2="338" y2="173"/>
          <line x1="446" y1="162" x2="462" y2="157"/>
          <line x1="446" y1="170" x2="462" y2="173"/>
        </g>

        <!-- Стекло шлема -->
        <circle cx="400" cy="140" r="72" fill="none" stroke="#eef3ff" stroke-width="8"/>
        <circle cx="400" cy="140" r="76" fill="none" stroke="#9fb3d9" stroke-width="2" stroke-opacity="0.7"/>
        <path d="M352,104 A58,58 0 0 1 386,80" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="6" stroke-linecap="round"/>
        <circle cx="344" cy="124" r="3.5" fill="#fff" fill-opacity="0.6"/>

        <!-- Антенна -->
        <line x1="440" y1="82" x2="452" y2="56" stroke="#9fb3d9" stroke-width="3" stroke-linecap="round"/>
        <circle cx="452" cy="53" r="5" fill="#ffd166">
          <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- Облачко с репликой -->
    <g transform="translate(510,52)">
      <g class="bubble">
        <rect x="0" y="0" width="180" height="46" rx="22" fill="#eef6ff" stroke="#4fc3f7" stroke-width="3"/>
        <path d="M20,42 L-6,62 L42,44 Z" fill="#eef6ff" stroke="#4fc3f7" stroke-width="3" stroke-linejoin="round"/>
        <path d="M16,43 L44,43" stroke="#eef6ff" stroke-width="5"/>
        <text x="90" y="30" text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="bold" font-size="19" fill="#2a4fb0">мяу в космосе!</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="798" height="338" rx="18" fill="none" stroke="#4fc3f7" stroke-opacity="0.35" stroke-width="2"/>
</svg>