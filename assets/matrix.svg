<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="clip"><rect width="800" height="260" rx="14"/></clipPath>

    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="165">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <g id="a"><text font-family="monospace" font-size="16" fill="url(#trail)"><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">A</tspan><tspan x="0" dy="16">7</tspan><tspan x="0" dy="16">F</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan></text></g>
    <g id="b"><text font-family="monospace" font-size="16" fill="url(#trail)"><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">{</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">#</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">}</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">/</tspan><tspan x="0" dy="16">1</tspan></text></g>
    <g id="c"><text font-family="monospace" font-size="16" fill="url(#trail)"><tspan x="0" dy="16">F</tspan><tspan x="0" dy="16">3</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">9</tspan><tspan x="0" dy="16">x</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">E</tspan><tspan x="0" dy="16">0</tspan></text></g>
  </defs>

  <style>
    .d { animation: fall linear infinite; }
    @keyframes fall {
      from { transform: translateY(-170px); }
      to   { transform: translateY(270px); }
    }
    .g1 { animation: gl1 3s infinite; opacity: 0; }
    .g2 { animation: gl2 3s infinite; opacity: 0; }
    @keyframes gl1 {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
      90% { transform: translate(-6px, 2px); opacity: .85; }
      93% { transform: translate(5px, -2px); opacity: .85; }
      96% { transform: translate(-3px, 1px); opacity: .85; }
    }
    @keyframes gl2 {
      0%, 88%, 100% { transform: translate(0, 0); opacity: 0; }
      91% { transform: translate(6px, -2px); opacity: .85; }
      94% { transform: translate(-5px, 2px); opacity: .85; }
      97% { transform: translate(3px, 0); opacity: .85; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="260" fill="#000"/>

    <!-- Дождь -->
    <g class="d" style="animation-duration:4.2s;animation-delay:-0.5s"><use xlink:href="#a" href="#a" x="20"/></g>
    <g class="d" style="animation-duration:5.1s;animation-delay:-3s"><use xlink:href="#b" href="#b" x="50"/></g>
    <g class="d" style="animation-duration:3.6s;animation-delay:-1.2s"><use xlink:href="#c" href="#c" x="80"/></g>
    <g class="d" style="animation-duration:4.8s;animation-delay:-2.4s"><use xlink:href="#a" href="#a" x="110"/></g>
    <g class="d" style="animation-duration:5.5s;animation-delay:-4s"><use xlink:href="#c" href="#c" x="140"/></g>
    <g class="d" style="animation-duration:3.9s;animation-delay:-0.8s"><use xlink:href="#b" href="#b" x="170"/></g>
    <g class="d" style="animation-duration:4.4s;animation-delay:-3.3s"><use xlink:href="#a" href="#a" x="200"/></g>
    <g class="d" style="animation-duration:5s;animation-delay:-1.7s"><use xlink:href="#c" href="#c" x="230"/></g>
    <g class="d" style="animation-duration:3.7s;animation-delay:-2.9s"><use xlink:href="#b" href="#b" x="260"/></g>
    <g class="d" style="animation-duration:5.3s;animation-delay:-0.2s"><use xlink:href="#a" href="#a" x="290"/></g>
    <g class="d" style="animation-duration:4.1s;animation-delay:-3.8s"><use xlink:href="#c" href="#c" x="320"/></g>
    <g class="d" style="animation-duration:4.9s;animation-delay:-1.1s"><use xlink:href="#b" href="#b" x="350"/></g>
    <g class="d" style="animation-duration:3.8s;animation-delay:-2.2s"><use xlink:href="#a" href="#a" x="380"/></g>
    <g class="d" style="animation-duration:5.2s;animation-delay:-4.5s"><use xlink:href="#c" href="#c" x="410"/></g>
    <g class="d" style="animation-duration:4.3s;animation-delay:-0.9s"><use xlink:href="#b" href="#b" x="440"/></g>
    <g class="d" style="animation-duration:4.7s;animation-delay:-3.1s"><use xlink:href="#a" href="#a" x="470"/></g>
    <g class="d" style="animation-duration:3.5s;animation-delay:-1.9s"><use xlink:href="#c" href="#c" x="500"/></g>
    <g class="d" style="animation-duration:5.4s;animation-delay:-2.6s"><use xlink:href="#b" href="#b" x="530"/></g>
    <g class="d" style="animation-duration:4s;animation-delay:-3.6s"><use xlink:href="#a" href="#a" x="560"/></g>
    <g class="d" style="animation-duration:4.6s;animation-delay:-0.4s"><use xlink:href="#c" href="#c" x="590"/></g>
    <g class="d" style="animation-duration:5s;animation-delay:-2s"><use xlink:href="#b" href="#b" x="620"/></g>
    <g class="d" style="animation-duration:3.9s;animation-delay:-1.5s"><use xlink:href="#a" href="#a" x="650"/></g>
    <g class="d" style="animation-duration:5.3s;animation-delay:-3.4s"><use xlink:href="#c" href="#c" x="680"/></g>
    <g class="d" style="animation-duration:4.2s;animation-delay:-4.2s"><use xlink:href="#b" href="#b" x="710"/></g>
    <g class="d" style="animation-duration:4.9s;animation-delay:-0.7s"><use xlink:href="#a" href="#a" x="740"/></g>
    <g class="d" style="animation-duration:3.7s;animation-delay:-2.8s"><use xlink:href="#c" href="#c" x="770"/></g>

    <!-- Затемнение под заголовком -->
    <rect y="95" width="800" height="90" fill="#000" fill-opacity="0.7"/>
    <line x1="0" y1="95" x2="800" y2="95" stroke="#00ff41" stroke-opacity="0.5"/>
    <line x1="0" y1="185" x2="800" y2="185" stroke="#00ff41" stroke-opacity="0.5"/>

    <!-- Глитч-заголовок -->
    <g font-family="monospace" font-weight="bold" font-size="54" text-anchor="middle">
      <text class="g1" x="400" y="156" fill="#ff003c">HACK THE PLANET</text>
      <text class="g2" x="400" y="156" fill="#00f0ff">HACK THE PLANET</text>
      <text x="400" y="156" fill="#00ff41" filter="url(#glow)">HACK THE PLANET</text>
    </g>

    <!-- Мигающая надпись -->
    <text x="400" y="228" text-anchor="middle" font-family="monospace" font-size="16" fill="#00ff41" letter-spacing="4">
      [ ACCESS GRANTED ]
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.6;0.7;1" dur="1.4s" repeatCount="indefinite"/>
    </text>

    <!-- Сканлайн -->
    <rect width="800" height="3" fill="#00ff41" opacity="0.12">
      <animate attributeName="y" values="-5;260" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="799" height="259" rx="14" fill="none" stroke="#00ff41" stroke-opacity="0.5"/>
</svg>