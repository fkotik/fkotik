<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sw" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><circle cx="150" cy="150" r="120"/></clipPath>
  </defs>

  <rect width="800" height="300" rx="14" fill="#000" stroke="#00ff41" stroke-opacity="0.5"/>

  <!-- Сетка радара -->
  <g fill="none" stroke="#00ff41" stroke-opacity="0.35">
    <circle cx="150" cy="150" r="120"/>
    <circle cx="150" cy="150" r="80"/>
    <circle cx="150" cy="150" r="40"/>
    <line x1="30" y1="150" x2="270" y2="150"/>
    <line x1="150" y1="30" x2="150" y2="270"/>
  </g>

  <!-- Луч -->
  <g clip-path="url(#clip)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="4s" repeatCount="indefinite"/>
      <path d="M150,150 L150,30 A120,120 0 0,0 46.1,90 Z" fill="url(#sw)"/>
      <line x1="150" y1="150" x2="150" y2="30" stroke="#00ff41" stroke-width="2"/>
    </g>
  </g>

  <!-- Баги: загораются, когда луч проходит -->
  <g fill="#ff003c">
    <circle cx="200" cy="90" r="4" opacity="0">
      <animate attributeName="opacity" values="1;0" dur="4s" begin="0.44s" repeatCount="indefinite"/>
    </circle>
    <circle cx="215" cy="205" r="4" opacity="0">
      <animate attributeName="opacity" values="1;0" dur="4s" begin="1.45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="190" r="4" opacity="0">
      <animate attributeName="opacity" values="1;0" dur="4s" begin="2.62s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="150" cy="150" r="4" fill="#00ff41"/>

  <!-- Консоль справа -->
  <g font-family="monospace" font-size="18" fill="#00ff41">
    <text x="330" y="50" font-size="14" fill="#00ff41" fill-opacity="0.6">// BUG SCANNER v1.0</text>

    <text x="330" y="100" opacity="0">&gt; scanning network...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.08;0.92;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="140" opacity="0" fill="#ff003c">&gt; target found: bug #404
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.23;0.92;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="180" opacity="0" fill="#ff003c">&gt; target found: bug #500
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.38;0.92;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="220" opacity="0">&gt; deploying patch...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.53;0.92;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="260" opacity="0" font-weight="bold">&gt; all bugs squashed. OK_
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.68;0.92;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>