<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0ff"/>
      <stop offset="1" stop-color="#ffe3f0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="300" rx="18"/></clipPath>
    <path id="heart" d="M0,4 C-8,-3 -5,-9 0,-5 C5,-9 8,-3 0,4 Z"/>
    <path id="star" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z"/>
  </defs>

  <style>
    .tail {
      transform-origin: 455px 235px;
      animation: wag 1.4s ease-in-out infinite alternate;
    }
    @keyframes wag {
      from { transform: rotate(-14deg); }
      to   { transform: rotate(18deg); }
    }

    .head { animation: bob 3s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-4px) rotate(-1.5deg); }
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s infinite;
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      94%           { transform: scaleY(0.08); }
    }

    .rise { animation: rise 4.5s ease-in infinite; opacity: 0; }
    @keyframes rise {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateY(-150px); opacity: 0; }
    }

    .bubble {
      transform-box: fill-box;
      transform-origin: 0% 100%;
      animation: pop 6s infinite;
    }
    @keyframes pop {
      0%, 8%   { transform: scale(0); opacity: 0; }
      14%      { transform: scale(1.15); opacity: 1; }
      18%, 55% { transform: scale(1); opacity: 1; }
      62%, 100%{ transform: scale(0); opacity: 0; }
    }

    .tw {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.4); opacity: 0.3; }
      50%      { transform: scale(1.2); opacity: 1; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="300" fill="url(#bg)"/>

    <!-- Звёздочки -->
    <g fill="#fff">
      <g transform="translate(80,60)"><g class="tw"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(180,120)"><g class="tw" style="animation-delay:-1s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(640,50)"><g class="tw" style="animation-delay:-0.5s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(720,140)"><g class="tw" style="animation-delay:-1.8s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(300,40)"><g class="tw" style="animation-delay:-1.3s"><use xlink:href="#star" href="#star"/></g></g>
    </g>

    <!-- Пол и тень -->
    <ellipse cx="400" cy="278" rx="210" ry="14" fill="#f7b6d2" fill-opacity="0.55"/>
    <ellipse cx="400" cy="276" rx="95" ry="9" fill="#d98fb0" fill-opacity="0.35"/>

    <!-- Хвост -->
    <g class="tail">
      <path d="M452,238 C510,238 525,180 490,165" fill="none" stroke="#e8a87c" stroke-width="20" stroke-linecap="round"/>
      <path d="M452,238 C510,238 525,180 490,165" fill="none" stroke="#ffe0c2" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Тело -->
    <ellipse cx="400" cy="232" rx="64" ry="46" fill="#ffe0c2" stroke="#e8a87c" stroke-width="3"/>
    <ellipse cx="400" cy="244" rx="38" ry="30" fill="#fff4e6"/>

    <!-- Лапки -->
    <ellipse cx="368" cy="272" rx="19" ry="10" fill="#fff4e6" stroke="#e8a87c" stroke-width="3"/>
    <ellipse cx="432" cy="272" rx="19" ry="10" fill="#fff4e6" stroke="#e8a87c" stroke-width="3"/>

    <!-- Голова -->
    <g class="head">
      <!-- Уши -->
      <path d="M335,138 L338,84 L386,118 Z" fill="#ffe0c2" stroke="#e8a87c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M465,138 L462,84 L414,118 Z" fill="#ffe0c2" stroke="#e8a87c" stroke-width="3" stroke-linejoin="round"/>
      <path d="M348,124 L349,100 L371,116 Z" fill="#ffb3cc"/>
      <path d="M452,124 L451,100 L429,116 Z" fill="#ffb3cc"/>

      <!-- Морда -->
      <ellipse cx="400" cy="160" rx="72" ry="60" fill="#ffe0c2" stroke="#e8a87c" stroke-width="3"/>

      <!-- Полоски на лбу -->
      <path d="M388,106 L391,120 M400,103 L400,118 M412,106 L409,120" stroke="#e8a87c" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Глаза -->
      <g class="eye">
        <ellipse cx="372" cy="160" rx="8" ry="10" fill="#4a3b47"/>
        <circle cx="375" cy="156" r="3" fill="#fff"/>
      </g>
      <g class="eye">
        <ellipse cx="428" cy="160" rx="8" ry="10" fill="#4a3b47"/>
        <circle cx="431" cy="156" r="3" fill="#fff"/>
      </g>

      <!-- Щёчки -->
      <ellipse cx="350" cy="180" rx="11" ry="6" fill="#ff9eb5" fill-opacity="0.7"/>
      <ellipse cx="450" cy="180" rx="11" ry="6" fill="#ff9eb5" fill-opacity="0.7"/>

      <!-- Носик и ротик -->
      <path d="M394,174 L406,174 L400,181 Z" fill="#ff8fab" stroke="#ff8fab" stroke-width="2" stroke-linejoin="round"/>
      <path d="M400,181 Q394,190 387,184 M400,181 Q406,190 413,184" stroke="#4a3b47" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <!-- Усики -->
      <g stroke="#c9a38a" stroke-width="2" stroke-linecap="round">
        <line x1="338" y1="176" x2="310" y2="170"/>
        <line x1="338" y1="184" x2="310" y2="188"/>
        <line x1="462" y1="176" x2="490" y2="170"/>
        <line x1="462" y1="184" x2="490" y2="188"/>
      </g>
    </g>

    <!-- Облачко с репликой -->
    <g transform="translate(490,70)">
      <g class="bubble">
        <rect x="0" y="0" width="120" height="50" rx="22" fill="#fff" stroke="#ff7eb6" stroke-width="3"/>
        <path d="M18,48 L10,68 L38,49 Z" fill="#fff" stroke="#ff7eb6" stroke-width="3" stroke-linejoin="round"/>
        <path d="M14,47 L40,47" stroke="#fff" stroke-width="5"/>
        <text x="60" y="33" text-anchor="middle" font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-weight="bold" font-size="22" fill="#ff7eb6">мяу~</text>
      </g>
    </g>

    <!-- Летящие сердечки -->
    <g transform="translate(250,250) scale(1.8)"><g class="rise" fill="#ff7eb6"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(310,260) scale(1.2)"><g class="rise" fill="#ffa6c9" style="animation-delay:-1.5s"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(540,255) scale(2)"><g class="rise" fill="#ff7eb6" style="animation-delay:-3s"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(590,265) scale(1.3)"><g class="rise" fill="#c9a6ff" style="animation-delay:-0.8s"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(200,265) scale(1.4)"><g class="rise" fill="#c9a6ff" style="animation-delay:-2.3s"><use xlink:href="#heart" href="#heart"/></g></g>
  </g>

  <rect x="1" y="1" width="798" height="298" rx="18" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.8"/>
</svg>