<svg width="800" height="70" viewBox="0 0 800 70" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <path id="heart" d="M0,4 C-8,-3 -5,-9 0,-5 C5,-9 8,-3 0,4 Z"/>
  </defs>

  <style>
    .b { animation: bounce 1.4s ease-in-out infinite; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-16px); }
    }
  </style>

  <g transform="translate(0,45)">
    <g transform="translate(300,0) scale(2.4)"><g class="b" fill="#ffb3cc"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(350,0) scale(2.4)"><g class="b" fill="#ff7eb6" style="animation-delay:-1.1s"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(400,0) scale(3)"><g class="b" fill="#ff5c9d" style="animation-delay:-0.8s"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(450,0) scale(2.4)"><g class="b" fill="#c9a6ff" style="animation-delay:-0.5s"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(500,0) scale(2.4)"><g class="b" fill="#a6c8ff" style="animation-delay:-0.2s"><use xlink:href="#heart" href="#heart"/></g></g>
  </g>
</svg>