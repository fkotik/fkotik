<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.6" stop-color="#141a46"/>
      <stop offset="1" stop-color="#2a2a77"/>
    </linearGradient>
    <radialGradient id="p1" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b4bcff"/>
      <stop offset="1" stop-color="#4338b5"/>
    </radialGradient>
    <radialGradient id="p2" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="260" rx="18"/></clipPath>
    <clipPath id="pc"><circle r="46"/></clipPath>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .s { animation: tw 3s ease-in-out infinite; }
    @keyframes tw {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }

    .bob { animation: bob 6s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }

    .shoot { opacity: 0; animation: shoot 7s linear infinite; }
    @keyframes shoot {
      0%   { transform: translate(0, 0); opacity: 0; }
      3%   { opacity: 1; }
      18%  { transform: translate(-300px, 150px); opacity: 0; }
      100% { transform: translate(-300px, 150px); opacity: 0; }
    }

    .title { animation: floaty 4s ease-in-out infinite; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="260" fill="url(#space)"/>

    <!-- Звёзды -->
    <g fill="#fff">
      <circle class="s" cx="40" cy="40" r="1.5"/>
      <circle class="s" cx="95" cy="75" r="1" style="animation-delay:-0.6s"/>
      <circle class="s" cx="170" cy="30" r="2" style="animation-delay:-1.2s"/>
      <circle class="s" cx="240" cy="70" r="1.2" style="animation-delay:-1.8s"/>
      <circle class="s" cx="300" cy="25" r="1.5" style="animation-delay:-2.4s"/>
      <circle class="s" cx="360" cy="60" r="1" style="animation-delay:-0.3s"/>
      <circle class="s" cx="440" cy="30" r="2" style="animation-delay:-0.9s"/>
      <circle class="s" cx="500" cy="75" r="1.2" style="animation-delay:-1.5s"/>
      <circle class="s" cx="560" cy="35" r="1.5" style="animation-delay:-2.1s"/>
      <circle class="s" cx="620" cy="70" r="1" style="animation-delay:-2.7s"/>
      <circle class="s" cx="690" cy="40" r="2" style="animation-delay:-0.4s"/>
      <circle class="s" cx="760" cy="80" r="1.2" style="animation-delay:-1s"/>
      <circle class="s" cx="30" cy="200" r="1.2" style="animation-delay:-1.6s"/>
      <circle class="s" cx="230" cy="215" r="1.5" style="animation-delay:-2.2s"/>
      <circle class="s" cx="330" cy="205" r="1" style="animation-delay:-0.2s"/>
      <circle class="s" cx="470" cy="210" r="1.5" style="animation-delay:-0.8s"/>
      <circle class="s" cx="580" cy="215" r="1" style="animation-delay:-1.4s"/>
      <circle class="s" cx="770" cy="215" r="1.5" style="animation-delay:-2s"/>
      <circle class="s" cx="20" cy="120" r="1" style="animation-delay:-2.5s"/>
      <circle class="s" cx="785" cy="130" r="1.2" style="animation-delay:-0.7s"/>
    </g>

    <!-- Падающие звёзды -->
    <g transform="translate(720,30)">
      <g class="shoot">
        <line x1="0" y1="0" x2="70" y2="-35" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
    <g transform="translate(560,15)">
      <g class="shoot" style="animation-delay:-3.5s">
        <line x1="0" y1="0" x2="60" y2="-30" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Планета с кольцом -->
    <g transform="translate(105,140)">
      <g class="bob">
        <g transform="rotate(-18)">
          <ellipse rx="74" ry="18" fill="none" stroke="#c9a24a" stroke-width="7"/>
        </g>
        <circle r="46" fill="url(#p1)"/>
        <g clip-path="url(#pc)">
          <path d="M-50,-16 Q0,-6 50,-18 L50,-8 Q0,2 -50,-6 Z" fill="#fff" opacity="0.13"/>
          <path d="M-50,12 Q0,22 50,10 L50,20 Q0,32 -50,22 Z" fill="#fff" opacity="0.1"/>
        </g>
        <g transform="rotate(-18)">
          <path d="M-74,0 A74,18 0 0 0 74,0" fill="none" stroke="#ffd166" stroke-width="7"/>
        </g>
      </g>
    </g>

    <!-- Оранжевая планета -->
    <g transform="translate(695,150)">
      <g class="bob" style="animation-delay:-3s">
        <circle r="26" fill="url(#p2)"/>
        <circle cx="-8" cy="-6" r="5" fill="#e8742a" opacity="0.55"/>
        <circle cx="9" cy="8" r="7" fill="#e8742a" opacity="0.5"/>
        <circle cx="10" cy="-12" r="3" fill="#e8742a" opacity="0.5"/>
      </g>
    </g>

    <!-- Заголовок -->
    <g class="title" font-family="'Trebuchet MS',Verdana,sans-serif" font-weight="bold" text-anchor="middle">
      <text x="400" y="128" font-size="44" fill="#4fc3f7" filter="url(#blur)">Привет, землянин!</text>
      <text x="400" y="128" font-size="44" fill="#ffffff">Привет, землянин!</text>
      <text x="400" y="170" font-size="18" font-weight="normal" fill="#9fc6ff" letter-spacing="1">добро пожаловать на мою орбиту</text>
    </g>

    <!-- Лунная поверхность -->
    <path d="M0,260 L0,238 Q150,216 300,238 T600,234 T800,242 L800,260 Z" fill="#20286b"/>
    <ellipse cx="150" cy="248" rx="22" ry="4" fill="#161c52"/>
    <ellipse cx="480" cy="250" rx="30" ry="5" fill="#161c52"/>
    <ellipse cx="700" cy="252" rx="18" ry="3.5" fill="#161c52"/>
  </g>

  <rect x="1" y="1" width="798" height="258" rx="18" fill="none" stroke="#4fc3f7" stroke-opacity="0.35" stroke-width="2"/>
</svg>