<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1e8"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="260" rx="18"/></clipPath>

    <g id="cloud" fill="#fff" fill-opacity="0.92">
      <ellipse cx="0" cy="0" rx="42" ry="16"/>
      <circle cx="-16" cy="-12" r="16"/>
      <circle cx="10" cy="-17" r="20"/>
    </g>

    <path id="star" d="M0,-9 L2.5,-2.5 L9,0 L2.5,2.5 L0,9 L-2.5,2.5 L-9,0 L-2.5,-2.5 Z"/>
    <path id="heart" d="M0,4 C-8,-3 -5,-9 0,-5 C5,-9 8,-3 0,4 Z"/>
  </defs>

  <style>
    .drift1 { animation: drift 9s ease-in-out infinite alternate; }
    .drift2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
    .drift3 { animation: drift 11s ease-in-out infinite alternate; }
    @keyframes drift {
      from { transform: translateX(-30px); }
      to   { transform: translateX(40px); }
    }

    .tw {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.3; }
      50%      { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }

    .title { animation: floaty 3s ease-in-out infinite; }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }

    .pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.3); }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="260" fill="url(#sky)"/>

    <!-- Звёздочки -->
    <g fill="#fff">
      <g transform="translate(90,50)"><g class="tw"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(200,30)"><g class="tw" style="animation-delay:-0.8s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(330,60)"><g class="tw" style="animation-delay:-1.6s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(470,35)"><g class="tw" style="animation-delay:-0.4s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(600,65)"><g class="tw" style="animation-delay:-1.2s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(720,40)"><g class="tw" style="animation-delay:-2s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(60,170)"><g class="tw" style="animation-delay:-1s"><use xlink:href="#star" href="#star"/></g></g>
      <g transform="translate(745,160)"><g class="tw" style="animation-delay:-0.2s"><use xlink:href="#star" href="#star"/></g></g>
    </g>

    <!-- Облачка -->
    <g transform="translate(130,110)"><g class="drift1"><use xlink:href="#cloud" href="#cloud"/></g></g>
    <g transform="translate(660,90)"><g class="drift2"><use xlink:href="#cloud" href="#cloud"/></g></g>
    <g transform="translate(560,200)"><g class="drift3"><use xlink:href="#cloud" href="#cloud"/></g></g>
    <g transform="translate(240,210)"><g class="drift2"><use xlink:href="#cloud" href="#cloud"/></g></g>

    <!-- Сердечки по бокам -->
    <g transform="translate(240,105) scale(2.2)"><g class="pulse" fill="#ff7eb6"><use xlink:href="#heart" href="#heart"/></g></g>
    <g transform="translate(560,105) scale(2.2)"><g class="pulse" fill="#ff7eb6" style="animation-delay:-0.6s"><use xlink:href="#heart" href="#heart"/></g></g>

    <!-- Заголовок -->
    <g class="title">
      <text x="400" y="130" text-anchor="middle"
            font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-weight="bold" font-size="68"
            fill="#fff" stroke="#ff7eb6" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Привет!</text>
      <text x="400" y="180" text-anchor="middle"
            font-family="'Comic Sans MS','Trebuchet MS',sans-serif" font-size="21" fill="#8a6fa8">добро пожаловать в мой уютный уголок</text>
    </g>

    <!-- Холмики -->
    <path d="M0,260 L0,238 Q200,205 400,238 T800,235 L800,260 Z" fill="#fff" fill-opacity="0.5"/>
  </g>

  <rect x="1" y="1" width="798" height="258" rx="18" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.8"/>
</svg>