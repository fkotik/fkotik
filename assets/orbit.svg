<svg width="800" height="80" viewBox="0 0 800 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.5" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="tr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="80" rx="14"/></clipPath>
  </defs>

  <style>
    .s { animation: tw 3s ease-in-out infinite; }
    @keyframes tw {
      0%, 100% { opacity: 0.2; }
      50%      { opacity: 1; }
    }
  </style>

  <g clip-path="url(#clip)">
    <rect width="800" height="80" fill="url(#bg)"/>

    <g fill="#fff">
      <circle class="s" cx="60" cy="20" r="1.5"/>
      <circle class="s" cx="150" cy="58" r="1" style="animation-delay:-0.7s"/>
      <circle class="s" cx="240" cy="25" r="1.5" style="animation-delay:-1.4s"/>
      <circle class="s" cx="330" cy="60" r="1" style="animation-delay:-2.1s"/>
      <circle class="s" cx="420" cy="18" r="2" style="animation-delay:-0.4s"/>
      <circle class="s" cx="510" cy="55" r="1.2" style="animation-delay:-1.1s"/>
      <circle class="s" cx="600" cy="22" r="1.5" style="animation-delay:-1.8s"/>
      <circle class="s" cx="690" cy="58" r="1" style="animation-delay:-2.5s"/>
      <circle class="s" cx="760" cy="28" r="1.5" style="animation-delay:-0.9s"/>
    </g>

    <!-- Ракета -->
    <g transform="translate(0,40)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="-70 0" to="880 0" dur="9s" repeatCount="indefinite"/>

        <!-- Шлейф -->
        <rect x="-340" y="-2" width="300" height="4" rx="2" fill="url(#tr)"/>

        <!-- Огонь -->
        <path d="M-28,0 L-54,-8 L-46,0 L-54,8 Z" fill="#ff8a3d">
          <animate attributeName="opacity" values="1;0.4;1" dur="0.15s" repeatCount="indefinite"/>
        </path>
        <path d="M-28,0 L-44,-4 L-40,0 L-44,4 Z" fill="#ffd166">
          <animate attributeName="opacity" values="0.5;1;0.5" dur="0.15s" repeatCount="indefinite"/>
        </path>

        <!-- Стабилизаторы -->
        <path d="M-28,-10 L-40,-22 L-12,-10 Z" fill="#4a6fd8"/>
        <path d="M-28,10 L-40,22 L-12,10 Z" fill="#4a6fd8"/>

        <!-- Корпус -->
        <path d="M-28,-10 L10,-10 Q34,-10 42,0 Q34,10 10,10 L-28,10 Z" fill="#f2f6ff" stroke="#9fb3d9" stroke-width="2"/>
        <path d="M20,-10 Q34,-9 42,0 Q34,9 20,10 Q26,0 20,-10 Z" fill="#4a6fd8"/>

        <!-- Иллюминатор с котиком -->
        <path d="M-1,-4 L0,-10 L4,-6 Z M9,-4 L8,-10 L4,-6 Z" fill="#ffb066"/>
        <circle cx="4" cy="0" r="7" fill="#4fc3f7" stroke="#9fb3d9" stroke-width="2"/>
        <circle cx="4" cy="1" r="4.5" fill="#ffb066"/>
        <circle cx="2.4" cy="0" r="0.9" fill="#1d1b2e"/>
        <circle cx="5.6" cy="0" r="0.9" fill="#1d1b2e"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="799" height="79" rx="14" fill="none" stroke="#4fc3f7" stroke-opacity="0.35"/>
</svg>